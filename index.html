<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตารางแข่งขัน WRO Robosports</title>
  
  <!-- Google Font: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <style>
    * {
      font-family: 'Prompt', sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #334155;
      padding-bottom: 40px;
    }

    .hero-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: white;
      padding: 24px 20px;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-bottom: 24px;
    }

    .card-custom {
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      background: #ffffff;
      overflow: hidden;
    }

    .search-box {
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 1.05rem;
      border: 1px solid #cbd5e1;
      box-shadow: none !important;
      cursor: pointer;
    }

    .table-container {
      overflow-x: auto;
    }

    #tableHead th {
      background-color: #0f172a !important;
      color: #ffffff !important;
      --bs-table-bg: #0f172a !important;
      --bs-table-color: #ffffff !important;
      font-weight: 600;
      padding: 16px 14px;
      font-size: 1.15rem;
      text-align: center;
      border-top: none !important;
      border-bottom: 2px solid #334155 !important;
      border-left: none !important;
      border-right: none !important;
    }

    .custom-table td {
      padding: 14px 16px;
      font-size: 1.1rem;
      vertical-align: middle !important;
      text-align: center;
      border-top: 1px solid #e2e8f0 !important;
      border-bottom: 1px solid #e2e8f0 !important;
      border-left: none !important;
      border-right: none !important;
    }

    /* เส้นแบ่งแนวนอนแบบหนา คั่นระหว่างแมตช์ 30-31 และ 45-46 */
    .thick-border-bottom td {
      border-bottom: 3.5px solid #0f172a !important;
    }

    /* สไตล์ข้อความแนวตั้งสำหรับคอลัมน์ที่ 1 (Rowspan) */
    .vertical-date-cell {
      vertical-align: middle !important;
      text-align: center !important;
      padding: 12px 6px !important;
      background-color: #ffffff !important;
      --bs-table-bg: #ffffff !important;
    }

    .vertical-date-wrapper {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      white-space: nowrap;
      margin: 0 auto;
      display: inline-block;
      font-weight: 600;
      font-size: 1.1rem;
      color: #0f172a;
      letter-spacing: 0.5px;
    }

    .text-red-team {
      color: #dc2626 !important;
      font-weight: 600;
    }

    .text-blue-team {
      color: #2563eb !important;
      font-weight: 600;
    }

    .wro-logo-footer {
      max-width: 220px;
      height: auto;
      object-fit: contain;
    }

    .loading-spinner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 0;
    }

    #tableHead th:nth-child(1) { width: 70px; }    /* คอลัมน์ 1 (วันที่ / Rowspan แนวตั้ง) */
    #tableHead th:nth-child(2) { width: 100px; }   /* คอลัมน์ 2 (ลำดับ / แนวนอนปกติ) */
    #tableHead th:nth-child(3) { width: 100px; }   /* คอลัมน์ 3 (สนาม) */
    #tableHead th:nth-child(4) { width: 130px; }   /* คอลัมน์ 4 (เวลา) */
    #tableHead th:nth-child(5) { width: 250px; }   /* คอลัมน์ 5 (Team Red) */
    #tableHead th:nth-child(6) { width: 250px; }   /* คอลัมน์ 6 (Team Blue) */
  </style>
</head>
<body>

  <!-- Header Section -->
  <div class="hero-header text-center">
    <div class="container">
      <h2 class="fw-bold mb-1">WRO Robosports Schedule</h2>
      <p class="mb-0 opacity-75 fs-6">ตารางการแข่งขันและตารางเวลาประกวด WRO ประเภท Robosports</p>
    </div>
  </div>

  <div class="container-fluid px-md-4">
    <div class="card card-custom p-3 p-md-4 mb-4">
      
      <!-- Controls Bar -->
      <div class="row g-3 align-items-center mb-3">
        <div class="col-md-8">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 rounded-start-3 text-muted">
              <i class="fa-solid fa-filter"></i>
            </span>
            <!-- เปลี่ยนจาก <input> เป็น <select> Dropdown -->
            <select id="searchInput" class="form-select search-box border-start-0 rounded-end-3" onchange="filterTable()">
              <option value="">-- แสดงข้อมูลทั้งหมด --</option>
            </select>
          </div>
        </div>
        <div class="col-md-4 text-md-end">
          <button class="btn btn-primary rounded-3 w-100 w-md-auto fw-medium fs-6" onclick="loadData()">
            <i class="fa-solid fa-rotate-right me-1"></i> รีเฟรชข้อมูล
          </button>
        </div>
      </div>

      <!-- Loading State -->
      <div id="loading" class="loading-spinner">
        <div class="spinner-border text-primary mb-3" style="width: 2.5rem; height: 2.5rem;" role="status"></div>
        <span class="text-muted fs-6">กำลังดึงข้อมูลตารางแข่งขัน...</span>
      </div>

      <!-- Error Message -->
      <div id="errorMessage" class="alert alert-danger d-none my-3" role="alert"></div>

      <!-- Table Content -->
      <div id="tableWrapper" class="table-container d-none">
        <table class="table custom-table align-middle" id="scheduleTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>

        <!-- WRO Logo ต่อท้ายตาราง -->
        <div class="text-center mt-4 pt-3 border-top">
          <img src="https://lh3.googleusercontent.com/d/1_xo4z-fSfB2uG2n1OOJKVABT9vW5fLQt" alt="WRO Logo" class="wro-logo-footer img-fluid">
        </div>
      </div>

      <!-- No Data Message -->
      <div id="noDataMessage" class="text-center py-4 text-muted d-none">
        <i class="fa-regular fa-folder-open fa-2x mb-2"></i>
        <p class="mb-0 fs-6">ไม่พบข้อมูลที่ค้นหา</p>
      </div>

    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // URL สำหรับใช้งานภายนอก (ใส่ Web App URL ของ Apps Script ที่นี่ หากใช้ GitHub Pages)
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzRRyU1BFiDdk2UXcyZ7z5sZdlgpCi_PyhJmwrl-wCULgxAUT-MV5BrT-MMV6nmQ1Kf/exec"; 

    let fullGridData = [];
    let headerList = [];

    document.addEventListener("DOMContentLoaded", function() {
      loadData();
    });

    function loadData() {
      document.getElementById("loading").classList.remove("d-none");
      document.getElementById("tableWrapper").classList.add("d-none");
      document.getElementById("errorMessage").classList.add("d-none");
      document.getElementById("noDataMessage").classList.add("d-none");

      // ตรวจสอบสภาพแวดล้อม Google Web App หรือ GitHub Pages
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(renderGrid)
          .withFailureHandler(showError)
          .getScheduleData();
      } else {
        if (!GAS_API_URL || GAS_API_URL === "YOUR_GAS_WEB_APP_URL_HERE") {
          showError("กรุณาระบุ GAS_API_URL ในโค้ดสคริปต์สำหรับใช้งานบน GitHub Pages");
          return;
        }

        fetch(`${GAS_API_URL}?api=true`)
          .then(res => {
            if (!res.ok) throw new Error("ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้");
            return res.json();
          })
          .then(data => renderGrid(data))
          .catch(err => showError(err.message));
      }
    }

    function renderGrid(response) {
      document.getElementById("loading").classList.add("d-none");

      if (!response.success) {
        showError(response.error);
        return;
      }

      fullGridData = response.grid;

      // เพิ่มรายการตัวเลือกใส่ใน <select> Dropdown
      populateDropdown(response.dropdownOptions);

      if (!fullGridData || fullGridData.length === 0) {
        document.getElementById("noDataMessage").classList.remove("d-none");
        return;
      }

      // เก็บชื่อคอลัมน์จาก Header
      const headerRow = fullGridData[0];
      headerList = headerRow.map(cell => cell.value ? cell.value.toString().toLowerCase() : '');

      let headHTML = '<tr>';
      headerRow.forEach(cell => {
        if (!cell.isMergedChild) {
          headHTML += `<th colspan="${cell.colspan}" rowspan="${cell.rowspan}">${escapeHtml(cell.value)}</th>`;
        }
      });
      headHTML += '</tr>';
      document.getElementById("tableHead").innerHTML = headHTML;

      displayBodyRows(fullGridData.slice(1));
      document.getElementById("tableWrapper").classList.none = false;
      document.getElementById("tableWrapper").classList.remove("d-none");
    }

    function populateDropdown(options) {
      const selectElem = document.getElementById("searchInput");
      selectElem.innerHTML = '<option value="">-- แสดงข้อมูลทั้งหมด --</option>';

      if (options && options.length > 0) {
        options.forEach(opt => {
          const option = document.createElement("option");
          option.value = opt;
          option.textContent = opt;
          selectElem.appendChild(option);
        });
      }
    }

    function displayBodyRows(rows) {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      if (rows.length === 0) {
        document.getElementById("noDataMessage").classList.remove("d-none");
        return;
      } else {
        document.getElementById("noDataMessage").classList.add("d-none");
      }

      rows.forEach(row => {
        let tr = document.createElement("tr");
        let isRowEmpty = row.every(cell => !cell.value || cell.value.trim() === '');
        if (isRowEmpty) return;

        // เช็คว่าเป็นแมตช์ 30 หรือ 45 เพื่อใส่เส้นขอบล่างแบบหนา
        const isMatchDivider = row.some(cell => {
          const v = cell.value ? cell.value.toString().trim() : '';
          return /^(match|แมตช์)?\s*(30|45)$/i.test(v);
        });

        if (isMatchDivider) {
          tr.classList.add("thick-border-bottom");
        }

        row.forEach((cell, colIndex) => {
          if (cell.isMergedChild) return;

          let td = document.createElement("td");
          if (cell.colspan > 1) td.setAttribute("colspan", cell.colspan);
          if (cell.rowspan > 1) td.setAttribute("rowspan", cell.rowspan);

          const cellText = cell.value ? cell.value.toString().trim() : '';
          const lowerText = cellText.toLowerCase();
          const colHeaderName = headerList[colIndex] || '';

          // 1. คอลัมน์ที่ 1 (Index 0) แสดงข้อความแนวตั้งรองรับ Rowspan
          if (colIndex === 0 && cellText !== '') {
            td.className = "vertical-date-cell";
            td.innerHTML = `<div class="vertical-date-wrapper">${escapeHtml(cellText)}</div>`;
          } 
          // 2. คอลัมน์ Team Red -> ตัวหนังสือสีแดง
          else if (colHeaderName.includes('red') || colHeaderName.includes('แดง') || lowerText.includes('แดง') || lowerText.includes('red')) {
            td.className = "text-red-team";
            td.textContent = cellText;
          } 
          // 3. คอลัมน์ Team Blue -> ตัวหนังสือสีน้ำเงิน
          else if (colHeaderName.includes('blue') || colHeaderName.includes('น้ำเงิน') || lowerText.includes('น้ำเงิน') || lowerText.includes('blue')) {
            td.className = "text-blue-team";
            td.textContent = cellText;
          } 
          // 4. คอลัมน์ที่ 2 (Index 1) และคอลัมน์อื่น ๆ แสดงตัวหนังสือแนวนอนปกติ
          else {
            td.textContent = cellText;
          }

          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });
    }

    function filterTable() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      if (!query) {
        displayBodyRows(fullGridData.slice(1));
        return;
      }

      const bodyRows = fullGridData.slice(1);
      const filtered = bodyRows.filter(row => {
        return row.some(cell => String(cell.value).toLowerCase().includes(query));
      });

      displayBodyRows(filtered);
    }

    function showError(msg) {
      document.getElementById("loading").classList.add("d-none");
      const errBox = document.getElementById("errorMessage");
      errBox.textContent = "เกิดข้อผิดพลาด: " + (msg || "ไม่สามารถดึงข้อมูลได้");
      errBox.classList.remove("d-none");
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function populateDropdown(options) {
      const selectElem = document.getElementById("searchInput");
      selectElem.innerHTML = '<option value="">-- แสดงข้อมูลทั้งหมด --</option>';

      if (options && options.length > 0) {
        // จัดเรียงข้อความภาษาไทยและตัวเลขก่อนใส่ลง Dropdown
        const sortedOptions = [...options].sort((a, b) => 
          a.localeCompare(b, 'th', { numeric: true, sensitivity: 'base' })
        );

        sortedOptions.forEach(opt => {
          const option = document.createElement("option");
          option.value = opt;
          option.textContent = opt;
          selectElem.appendChild(option);
        });
      }
    }
  </script>
</body>
</html>
